<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><title>JD Capital</title>
<style>
body{margin:0;background:#f4f6f8;color:#111827;font-family:system-ui}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card{background:white;border-radius:18px;padding:16px;box-shadow:0 2px 15px #0001}.metric{font-size:28px;font-weight:800}.muted{color:#6b7280}.hero{background:#111827;color:white;padding:20px;border-radius:20px}.hero .muted{color:#a9b0bb}textarea{width:100%;min-height:150px;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #ddd;font:inherit}button{background:#111827;color:white;border:0;border-radius:11px;padding:11px 15px;font-weight:800;margin-top:10px}#report{white-space:pre-wrap;line-height:1.5;margin-top:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><div class="muted">PRIVATE WEALTH SYSTEM</div><h1>JD Capital</h1></div><div>☁️ CLOUD</div></div>
<div class="grid"><div class="card"><div class="muted">Ingresos</div><div class="metric" id="rev">$0</div></div><div class="card"><div class="muted">Gasto</div><div class="metric" id="spent">$0</div></div><div class="card"><div class="muted">Oportunidades</div><div class="metric" id="opp">0</div></div><div class="card"><div class="muted">Auto gasto</div><div class="metric" style="font-size:18px" id="auto">$0</div></div></div>
<div class="hero"><h2>Primera misión</h2><p>Conseguir el primer USD con capital inicial 0.</p><p class="muted">La PC puede estar apagada.</p></div>
<div class="card" style="margin-top:14px"><h2>Investigación</h2><textarea id="mission">Encontrá y verificá oportunidades actuales para conseguir el primer USD con capital inicial cero, priorizando Argentina y oportunidades globales. Incluí microtareas, pruebas de productos, afiliación, leads, productos digitales, automatización con IA, micro-SaaS, e-commerce y categorías nuevas. Verificá reglas, cobros y demanda.</textarea><button id="go" onclick="go()">▶ Ejecutar misión</button><div id="report"></div></div>
<div class="card" style="margin-top:14px"><h2>Oportunidades</h2><div id="list">Cargando...</div></div>
<form method="post" action="/logout"><button style="background:#6b7280">Cerrar sesión</button></form></div>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function refresh(){const r=await fetch('/api/state');if(r.status===401){location='/login';return}const s=await r.json();rev.textContent='$'+Number(s.summary.revenue_usd||0).toFixed(2);spent.textContent='$'+Number(s.summary.spent_usd||0).toFixed(2);opp.textContent=s.summary.opportunities||0;auto.textContent='$'+Number(s.auto_spend_usd||0).toFixed(2);const a=s.opportunities||[];list.innerHTML=a.length?'<table><tr><th>Título</th><th>Score</th><th>Riesgo</th><th>Test</th></tr>'+a.slice(0,10).map(x=>`<tr><td>${esc(x.title)}</td><td>${x.score||0}</td><td>${esc(x.risk||'')}</td><td>$${Number(x.experiment_cost_usd||0).toFixed(2)}</td></tr>`).join('')+'</table>':'Sin oportunidades todavía.'}
async function go(){goBtn=document.querySelector('#go');goBtn.disabled=true;goBtn.textContent='Trabajando en la nube...';report.textContent='Ejecutando agentes...';try{const r=await fetch('/api/mission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mission:mission.value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Error');report.textContent=d.director;await refresh()}catch(e){report.textContent='Error: '+e.message}finally{goBtn.disabled=false;goBtn.textContent='▶ Ejecutar misión'}}
refresh();
</script></body></html>
